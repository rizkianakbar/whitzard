# Local PostgreSQL for development and tests. Dev-only credentials; never use them elsewhere.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: whitzard
      POSTGRES_PASSWORD: whitzard
      POSTGRES_DB: whitzard
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whitzard -d whitzard"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
